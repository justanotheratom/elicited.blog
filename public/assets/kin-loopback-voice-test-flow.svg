<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 520"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">KIN loopback voice test flow</title>
  <desc id="desc">
    A local runner uses FlowDeck, XCUITest, a helper server, Loopback audio, the
    iOS Simulator, KIN, and the local backend to test voice-created calendar
    events.
  </desc>
  <defs>
    <marker
      id="arrow"
      viewBox="0 0 10 10"
      refX="9"
      refY="5"
      markerWidth="8"
      markerHeight="8"
      orient="auto-start-reverse"
    >
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155" />
    </marker>
    <style>
      .bg {
        fill: #f8fafc;
      }
      .box {
        fill: #ffffff;
        stroke: #cbd5e1;
        stroke-width: 2;
        rx: 8;
      }
      .box-accent {
        fill: #ecfeff;
        stroke: #0891b2;
        stroke-width: 2;
        rx: 8;
      }
      .box-backend {
        fill: #f0fdf4;
        stroke: #16a34a;
        stroke-width: 2;
        rx: 8;
      }
      .label {
        fill: #0f172a;
        font:
          600 18px ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        text-anchor: middle;
      }
      .small {
        fill: #475569;
        font:
          14px ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        text-anchor: middle;
      }
      .note {
        fill: #334155;
        font:
          14px ui-monospace,
          SFMono-Regular,
          Menlo,
          Monaco,
          Consolas,
          "Liberation Mono",
          monospace;
        text-anchor: middle;
      }
      .arrow {
        stroke: #334155;
        stroke-width: 2.5;
        fill: none;
        marker-end: url(#arrow);
      }
      .dash {
        stroke-dasharray: 7 6;
      }
      .lane {
        fill: none;
        stroke: #e2e8f0;
        stroke-width: 2;
      }
      @media (prefers-color-scheme: dark) {
        .bg {
          fill: #020617;
        }
        .box {
          fill: #0f172a;
          stroke: #334155;
        }
        .box-accent {
          fill: #083344;
          stroke: #06b6d4;
        }
        .box-backend {
          fill: #052e16;
          stroke: #22c55e;
        }
        .label {
          fill: #f8fafc;
        }
        .small,
        .note {
          fill: #cbd5e1;
        }
        .arrow {
          stroke: #cbd5e1;
        }
        .lane {
          stroke: #1e293b;
        }
        #arrow path {
          fill: #cbd5e1;
        }
      }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="520" rx="18" />
  <path class="lane" d="M 60 188 H 1140" />
  <path class="lane" d="M 60 350 H 1140" />

  <text class="small" x="90" y="92">test control</text>
  <text class="small" x="90" y="254">audio path</text>
  <text class="small" x="90" y="416">assertion</text>

  <rect class="box" x="120" y="122" width="140" height="92" rx="8" />
  <text class="label" x="190" y="160">Runner</text>
  <text class="small" x="190" y="186">starts stack</text>

  <rect class="box" x="330" y="122" width="140" height="92" rx="8" />
  <text class="label" x="400" y="160">FlowDeck</text>
  <text class="small" x="400" y="186">runs simulator</text>

  <rect class="box-accent" x="540" y="122" width="150" height="92" rx="8" />
  <text class="label" x="615" y="160">XCUITest</text>
  <text class="small" x="615" y="186">holds voice bar</text>

  <rect class="box" x="540" y="284" width="150" height="92" rx="8" />
  <text class="label" x="615" y="322">Helper</text>
  <text class="small" x="615" y="348">plays fixture</text>

  <rect class="box-accent" x="760" y="284" width="150" height="92" rx="8" />
  <text class="label" x="835" y="322">Loopback</text>
  <text class="small" x="835" y="348">virtual mic</text>

  <rect class="box" x="760" y="122" width="150" height="92" rx="8" />
  <text class="label" x="835" y="160">Simulator</text>
  <text class="small" x="835" y="186">records audio</text>

  <rect class="box-accent" x="980" y="122" width="140" height="92" rx="8" />
  <text class="label" x="1050" y="160">KIN</text>
  <text class="small" x="1050" y="186">voice path</text>

  <rect class="box-backend" x="760" y="406" width="150" height="70" rx="8" />
  <text class="label" x="835" y="436">Backend</text>
  <text class="small" x="835" y="460">infer + mutate</text>

  <rect class="box-backend" x="980" y="406" width="140" height="70" rx="8" />
  <text class="label" x="1050" y="436">Supabase</text>
  <text class="small" x="1050" y="460">event exists</text>

  <path class="arrow" d="M 260 168 H 330" />
  <path class="arrow" d="M 470 168 H 540" />
  <path class="arrow" d="M 690 168 H 760" />
  <path class="arrow" d="M 910 168 H 980" />

  <path class="arrow dash" d="M 615 214 V 284" />
  <path class="arrow" d="M 690 330 H 760" />
  <path class="arrow" d="M 835 284 V 214" />
  <path class="arrow" d="M 1050 214 C 1050 290 930 304 865 406" />
  <path class="arrow" d="M 910 441 H 980" />
  <path class="arrow dash" d="M 980 441 C 690 512 230 486 190 214" />

  <text class="note" x="295" y="151">run app</text>
  <text class="note" x="505" y="151">test only voice</text>
  <text class="note" x="725" y="151">press(forDuration:)</text>
  <text class="note" x="945" y="151">record + send</text>
  <text class="note" x="690" y="264">GET /play?delay=0.45</text>
  <text class="note" x="725" y="314">afplay</text>
  <text class="note" x="882" y="258">mic input</text>
  <text class="note" x="980" y="304">transcribe + infer</text>
  <text class="note" x="945" y="425">poll DB</text>
</svg>
